[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slm_lib"
version = "0.1.0"
description = "Tools for SLM control and optimization"
authors = [
  { name="Robert Neumann", email="deine@email.de" }
]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
  "numpy",
  "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]